services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile.development
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:${APP_PORT:-8080}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: report_gen
            DB_USERNAME: report_gen
            DB_PASSWORD: report_gen
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - storage_data:/var/www/html/storage
            - bootstrap_cache_data:/var/www/html/bootstrap/cache
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
            interval: 5s
            timeout: 3s
            retries: 20

    nginx:
        image: nginx:1.27-alpine
        volumes:
            - .:/var/www/html:ro
            - storage_data:/var/www/html/storage:ro
            - bootstrap_cache_data:/var/www/html/bootstrap/cache:ro
            - ./docker/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:80"
        depends_on:
            app:
                condition: service_healthy
            node:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/up || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 20

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: report_gen
            MYSQL_USER: report_gen
            MYSQL_PASSWORD: report_gen
            MYSQL_ROOT_PASSWORD: report_gen_root
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s

    node:
        image: node:22-bookworm-slim
        working_dir: /var/www/html
        environment:
            VITE_PORT: ${VITE_PORT:-5173}
            VITE_HMR_HOST: localhost
            VITE_USE_POLLING: "true"
        volumes:
            - .:/var/www/html
            - node_modules_data:/var/www/html/node_modules
        entrypoint: ["/var/www/html/docker/node/entrypoint.development.sh"]
        ports:
            - "127.0.0.1:${VITE_PORT:-5173}:5173"
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.VITE_PORT + '/').then(() => process.exit(0)).catch(() => process.exit(1))"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 10s

volumes:
    vendor_data:
    node_modules_data:
    mysql_data:
    storage_data:
    bootstrap_cache_data:
